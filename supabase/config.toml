# Supabase project configuration
# Documentação: https://supabase.com/docs/guides/cli/config

[project]
id = "megacapacetes"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://megacapacetes.store"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false       # Desabilitar signup público (admin cria usuários manualmente)
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false
secure_password_change = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.checkout-create-pix]
verify_jwt = false   # Chamado pelo frontend sem autenticação

[functions.admin]
verify_jwt = true    # Requer autenticação Supabase

[functions.orders]
verify_jwt = false   # Consulta pública

[functions.send-tracking-email]
verify_jwt = false   # Chamado por outras funções (service role)

[functions.pix-webhook]
verify_jwt = false   # Webhook externo (IronPay não envia JWT)

[functions.fb-purchase]
verify_jwt = false   # Chamado por outras funções

[functions.utmify-order]
verify_jwt = false   # Chamado por outras funções

[functions.checkout]
verify_jwt = false   # Chamado pelo frontend
